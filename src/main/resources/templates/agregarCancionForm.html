<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Agregar Canci&oacute;n</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h1>Nueva Canci&oacute;n</h1>
    <form th:action="@{/cancion/guardarCancion}" th:object="${cancion}" method="post" class="w-50">
        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" id="nombre" th:field="*{nombre}" class="form-control" placeholder="Nombre de la canci&oacute;n">
        </div>
        <div class="mb-3">
            <label for="duracion" class="form-label">Duraci&oacute;n</label>
            <input type="number" id="duracion" th:field="*{duracion}" class="form-control" step="0.01" placeholder="0.00">
        </div>
        <div class="mb-3">
            <label for="album" class="form-label">&Aacute;lbum</label>
            <select id="album" name="albumId" class="form-select">
                <option value="">Seleccione un &aacute;lbum</option>
                <option th:each="alb : ${albumnes}" th:value="${alb.id}" th:text="${alb.titulo}"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="/cancion/canciones" class="btn btn-secondary">Cancelar</a>
    </form>
</body>
</html>
