<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Canción — KMusic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-glass { background: rgba(255,255,255,0.08); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .sidebar-active { background: rgba(168,85,247,0.25); }
        .sidebar-link { color: #9ca3af; transition: all 0.2s; }
        .sidebar-link:hover { color: #fff; background: rgba(255,255,255,0.05); }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 min-vh-100 text-white">
    <div class="d-flex flex-column flex-md-row">
        <aside class="w-100 w-md-64 bg-black bg-opacity-30 p-4 border-bottom border-md-bottom-0 border-md-end border-white border-opacity-10" style="flex: 0 0 auto; width: 16rem;">
            <h1 class="fs-4 fw-bold mb-4" style="background: linear-gradient(135deg, #a78bfa, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">KMusic</h1>
            <nav class="d-flex flex-md-column gap-2">
                <a href="/cancion/listar" class="sidebar-link d-flex align-items-center gap-3 px-3 py-2 rounded-3 sidebar-active text-decoration-none">
                    <svg class="flex-shrink-0" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/></svg>
                    Canciones
                </a>
                <a href="/album/listar" class="sidebar-link d-flex align-items-center gap-3 px-3 py-2 rounded-3 text-decoration-none">
                    <svg class="flex-shrink-0" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                    Álbumes
                </a>
                <a href="/artista/listar" class="sidebar-link d-flex align-items-center gap-3 px-3 py-2 rounded-3 text-decoration-none">
                    <svg class="flex-shrink-0" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    Artistas
                </a>
            </nav>
        </aside>

        <main class="flex-grow-1 p-4 p-md-5">
            <div class="container-fluid p-0" style="max-width: 640px;">
                <div class="mb-4">
                    <a href="/cancion/listar" class="btn btn-sm btn-link text-secondary text-decoration-none p-0 d-inline-flex align-items-center gap-1">
                        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                        Volver a canciones
                    </a>
                </div>

                <div class="bg-glass rounded-4 border border-white border-opacity-10 p-4 p-md-5">
                    <h2 class="fs-2 fw-bold mb-4">Nueva Canción</h2>

                    <form th:action="@{/cancion/guardar}" th:object="${cancion}" method="post">
                        <div class="mb-4">
                            <label for="nombre" class="form-label text-secondary small fw-medium">Nombre</label>
                            <input type="text" id="nombre" th:field="*{nombre}" placeholder="Nombre de la canción" class="form-control form-control-lg bg-black bg-opacity-25 text-white border-white border-opacity-10" style="background: rgba(0,0,0,0.25) !important;">
                        </div>

                        <div class="mb-4">
                            <label for="duracion" class="form-label text-secondary small fw-medium">Duración</label>
                            <input type="number" id="duracion" th:field="*{duracion}" step="0.01" placeholder="0.00" class="form-control form-control-lg bg-black bg-opacity-25 text-white border-white border-opacity-10" style="background: rgba(0,0,0,0.25) !important;">
                        </div>

                        <div class="mb-4">
                            <label for="album" class="form-label text-secondary small fw-medium">Álbum</label>
                            <select id="album" name="albumId" class="form-select form-select-lg bg-black bg-opacity-25 text-white border-white border-opacity-10" style="background: rgba(0,0,0,0.25) !important;">
                                <option value="" class="bg-dark">Seleccione un álbum</option>
                                <option th:each="alb : ${albumnes}" th:value="${alb.id}" th:text="${alb.titulo}" class="bg-dark"></option>
                            </select>
                        </div>

                        <div class="d-flex align-items-center gap-3 pt-2">
                            <button type="submit" class="btn btn-primary btn-lg px-5 shadow-lg" style="background: linear-gradient(135deg, #a78bfa, #f472b6); border: none;">
                                Guardar
                            </button>
                            <a href="/cancion/listar" class="btn btn-link text-secondary text-decoration-none px-3">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
