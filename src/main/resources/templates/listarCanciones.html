<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{fragments/head :: head('Lista de Canciones')}"></th:block>
<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 min-vh-100 text-white">
    <div class="d-flex flex-column flex-md-row" style="min-height: 100vh;">
        <th:block th:replace="~{fragments/sidebar :: sidebar(paginaActiva='canciones')}"></th:block>

        <main class="flex-grow-1 p-4 ps-md-4 pe-md-5 d-flex flex-column">
            <div class="container-fluid p-0 flex-grow-1">
                <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-3 mb-4">
                    <h2 class="fs-1 fw-bold mb-0">Canciones</h2>
                    <a href="/cancion/agregar" class="btn btn-lg btn-primary d-inline-flex align-items-center gap-2 shadow-lg" style="background: linear-gradient(135deg, #a78bfa, #f472b6); border: none;">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                        Agregar Canción
                    </a>
                </div>

                <div class="bg-glass rounded-4 border border-white border-opacity-10 overflow-hidden">
                    <div class="table-responsive">
                        <table class="table table-dark table-striped table-hover align-middle mb-0">
                            <thead>
                                <tr class="text-uppercase small fw-semibold text-secondary">
                                    <th class="px-4 py-3">ID</th>
                                    <th class="px-4 py-3">Nombre</th>
                                    <th class="px-4 py-3">Duración</th>
                                    <th class="px-4 py-3">Álbum</th>
                                    <th class="px-4 py-3 text-end">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="cancion : ${canciones}">
                                    <td class="px-4 text-secondary small" th:text="${cancion.id}">1</td>
                                    <td class="px-4 fw-medium" th:text="${cancion.nombre}">Nombre</td>
                                    <td class="px-4">
                                        <span class="d-inline-flex align-items-center gap-1 text-secondary">
                                            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" class="text-purple-400"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                            <span th:text="${cancion.duracion}">3.50</span>
                                        </span>
                                    </td>
                                    <td class="px-4 text-secondary small" th:text="${cancion.album.titulo}">Álbum</td>
                                    <td class="px-4 text-end">
                                        <div class="d-flex justify-content-end gap-2">
                                            <a th:href="@{/cancion/actualizar/{id}(id=${cancion.id})}" class="btn btn-sm btn-warning d-inline-flex align-items-center gap-1">
                                                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                                                Editar
                                            </a>
                                            <a th:href="@{/cancion/eliminar/{id}(id=${cancion.id})}" onclick="return confirm('¿Eliminar canción?')" class="btn btn-sm btn-outline-danger d-inline-flex align-items-center gap-1">
                                                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                                Eliminar
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div th:if="${#lists.isEmpty(canciones)}" class="text-center mt-4">
                    <span class="text-secondary">No hay canciones registradas.</span>
                </div>
            </div>

            <th:block th:replace="~{fragments/footer :: footer}"></th:block>
        </main>
    </div>
</body>
</html>
