<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' — KMusic'">KMusic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-glass { background: rgba(255,255,255,0.08); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .sidebar-active { background: rgba(168,85,247,0.25); }
        .sidebar-link { color: #9ca3af; transition: all 0.2s; }
        .sidebar-link:hover { color: #fff; background: rgba(255,255,255,0.05); }
        main { min-width: 0; }
    </style>
</head>
</html>
