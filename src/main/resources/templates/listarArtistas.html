<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{fragments/head :: head('Lista de Artistas')}"></th:block>
<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 min-vh-100 text-white">
    <div class="d-flex flex-column flex-md-row" style="min-height: 100vh;">
        <th:block th:replace="~{fragments/sidebar :: sidebar(paginaActiva='artistas')}"></th:block>

        <main class="flex-grow-1 p-4 ps-md-4 pe-md-5 d-flex flex-column">
            <div class="container-fluid p-0 flex-grow-1">
                <div class="mb-4">
                    <h2 class="fs-1 fw-bold mb-0">Artistas</h2>
                </div>

                <div class="bg-glass rounded-4 border border-white border-opacity-10 overflow-hidden">
                    <div class="table-responsive">
                        <table class="table table-dark table-striped table-hover align-middle mb-0">
                            <thead>
                                <tr class="text-uppercase small fw-semibold text-secondary">
                                    <th class="px-4 py-3">ID</th>
                                    <th class="px-4 py-3">Email</th>
                                    <th class="px-4 py-3">Nacionalidad</th>
                                    <th class="px-4 py-3">Fecha de Nacimiento</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="artista : ${artistas}">
                                    <td class="px-4 text-secondary small" th:text="${artista.id}">1</td>
                                    <td class="px-4">
                                        <div class="d-flex align-items-center gap-3">
                                            <div class="rounded-circle bg-gradient d-flex align-items-center justify-content-center fw-bold flex-shrink-0" style="width: 36px; height: 36px; background: linear-gradient(135deg, #a78bfa, #f472b6);">
                                                <span th:text="${#strings.substring(artista.email, 0, 1).toUpperCase()}" class="small">U</span>
                                            </div>
                                            <span th:text="${artista.email}" class="small">email@example.com</span>
                                        </div>
                                    </td>
                                    <td class="px-4">
                                        <span class="badge rounded-pill px-3 py-1 fw-normal small" style="background: rgba(168,85,247,0.2); color: #d8b4fe;" th:text="${artista.nacionalidad}">Argentina</span>
                                    </td>
                                    <td class="px-4 text-secondary small" th:text="${#temporals.format(artista.fechaNacimiento, 'dd/MM/yyyy')}">01/01/2000</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div th:if="${#lists.isEmpty(artistas)}" class="text-center mt-4">
                    <span class="text-secondary">No hay artistas registrados.</span>
                </div>
            </div>

            <th:block th:replace="~{fragments/footer :: footer}"></th:block>
        </main>
    </div>
</body>
</html>
