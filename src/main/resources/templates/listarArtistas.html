<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Artistas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h1>Artistas</h1>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Email</th>
                <th>Nacionalidad</th>
                <th>Fecha de Nacimiento</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="artista : ${artistas}">
                <td th:text="${artista.id}">1</td>
                <td th:text="${artista.email}">email@example.com</td>
                <td th:text="${artista.nacionalidad}">Argentina</td>
                <td th:text="${#temporals.format(artista.fechaNacimiento, 'dd/MM/yyyy')}">01/01/2000</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
