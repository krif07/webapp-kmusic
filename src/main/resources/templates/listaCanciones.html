<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Canciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h1>Canciones</h1>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Duración</th>
                <th>Álbum</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="cancion : ${canciones}">
                <td th:text="${cancion.id}">1</td>
                <td th:text="${cancion.nombre}">Nombre</td>
                <td th:text="${cancion.duracion}">3.50</td>
                <td th:text="${cancion.album.titulo}">Álbum</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
