<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{fragments/head :: head('Lista de Álbumes')}"></th:block>
<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 min-vh-100 text-white">
    <div class="d-flex flex-column flex-md-row" style="min-height: 100vh;">
        <th:block th:replace="~{fragments/sidebar :: sidebar(paginaActiva='albumes')}"></th:block>

        <main class="flex-grow-1 p-4 ps-md-4 pe-md-5 d-flex flex-column">
            <div class="container-fluid p-0 flex-grow-1">
                <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-3 mb-4">
                    <h2 class="fs-1 fw-bold mb-0">Álbumes</h2>
                    <a href="/album/agregar" class="btn btn-lg btn-primary d-inline-flex align-items-center gap-2 shadow-lg" style="background: linear-gradient(135deg, #a78bfa, #f472b6); border: none;">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                        Agregar Álbum
                    </a>
                </div>

                <div class="bg-glass rounded-4 border border-white border-opacity-10 overflow-hidden">
                    <div class="table-responsive">
                        <table class="table table-dark table-striped table-hover align-middle mb-0">
                            <thead>
                                <tr class="text-uppercase small fw-semibold text-secondary">
                                    <th class="px-4 py-3">ID</th>
                                    <th class="px-4 py-3">Título</th>
                                    <th class="px-4 py-3">Género</th>
                                    <th class="px-4 py-3">Fecha de Estreno</th>
                                    <th class="px-4 py-3">Artista</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="album : ${albumes}">
                                    <td class="px-4 text-secondary small" th:text="${album.id}">1</td>
                                    <td class="px-4 fw-medium" th:text="${album.titulo}">Título</td>
                                    <td class="px-4">
                                        <span class="badge rounded-pill px-3 py-1 fw-normal small" style="background: rgba(16,185,129,0.2); color: #6ee7b7;" th:text="${album.genero}">Género</span>
                                    </td>
                                    <td class="px-4 text-secondary small" th:text="${#temporals.format(album.fechaEstreno, 'dd/MM/yyyy')}">01/01/2024</td>
                                    <td class="px-4 text-secondary small" th:text="${album.artista.email}">Artista</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div th:if="${#lists.isEmpty(albumes)}" class="text-center mt-4">
                    <span class="text-secondary">No hay álbumes registrados.</span>
                </div>
            </div>

            <th:block th:replace="~{fragments/footer :: footer}"></th:block>
        </main>
    </div>
</body>
</html>
