<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de &Aacute;lbumes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h1>&Aacute;lbumes</h1>
    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>T&iacute;tulo</th>
                <th>G&eacute;nero</th>
                <th>Fecha de Estreno</th>
                <th>Artista</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="album : ${albumes}">
                <td th:text="${album.id}">1</td>
                <td th:text="${album.titulo}">T&iacute;tulo</td>
                <td th:text="${album.genero}">G&eacute;nero</td>
                <td th:text="${#temporals.format(album.fechaEstreno, 'dd/MM/yyyy')}">01/01/2024</td>
                <td th:text="${album.artista.email}">Artista</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
