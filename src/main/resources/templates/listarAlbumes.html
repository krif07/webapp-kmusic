<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Álbumes — KMusic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-glass { background: rgba(255,255,255,0.08); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .sidebar-active { background: rgba(168,85,247,0.25); }
        .sidebar-link { color: #9ca3af; transition: all 0.2s; }
        .sidebar-link:hover { color: #fff; background: rgba(255,255,255,0.05); }
        main { min-width: 0; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 min-vh-100 text-white">
    <div class="d-flex flex-column flex-md-row">
        <aside class="bg-black bg-opacity-30 p-4 border-bottom border-md-bottom-0 border-md-end border-white border-opacity-10" style="flex: 0 0 auto; width: 14rem;">
            <h1 class="fs-4 fw-bold mb-4" style="background: linear-gradient(135deg, #a78bfa, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">KMusic</h1>
            <nav class="d-flex flex-md-column gap-2">
                <a href="/cancion/listar" class="sidebar-link d-flex align-items-center gap-3 px-3 py-2 rounded-3 text-decoration-none">
                    <svg class="flex-shrink-0" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/></svg>
                    Canciones
                </a>
                <a href="/album/listar" class="sidebar-link d-flex align-items-center gap-3 px-3 py-2 rounded-3 sidebar-active text-decoration-none">
                    <svg class="flex-shrink-0" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                    Álbumes
                </a>
                <a href="/artista/listar" class="sidebar-link d-flex align-items-center gap-3 px-3 py-2 rounded-3 text-decoration-none">
                    <svg class="flex-shrink-0" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    Artistas
                </a>
            </nav>
        </aside>

        <main class="flex-grow-1 p-4 ps-md-4 pe-md-5">
            <div class="container-fluid p-0">
                <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-3 mb-4">
                    <h2 class="fs-1 fw-bold mb-0">Álbumes</h2>
                    <a href="/album/agregar" class="btn btn-lg btn-primary d-inline-flex align-items-center gap-2 shadow-lg" style="background: linear-gradient(135deg, #a78bfa, #f472b6); border: none;">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                        Agregar Álbum
                    </a>
                </div>

                <div class="bg-glass rounded-4 border border-white border-opacity-10 overflow-hidden">
                    <div class="table-responsive">
                        <table class="table table-dark table-striped table-hover align-middle mb-0">
                            <thead>
                                <tr class="text-uppercase small fw-semibold text-secondary">
                                    <th class="px-4 py-3">ID</th>
                                    <th class="px-4 py-3">Título</th>
                                    <th class="px-4 py-3">Género</th>
                                    <th class="px-4 py-3">Fecha de Estreno</th>
                                    <th class="px-4 py-3">Artista</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="album : ${albumes}">
                                    <td class="px-4 text-secondary small" th:text="${album.id}">1</td>
                                    <td class="px-4 fw-medium" th:text="${album.titulo}">Título</td>
                                    <td class="px-4">
                                        <span class="badge rounded-pill px-3 py-1 fw-normal small" style="background: rgba(16,185,129,0.2); color: #6ee7b7;" th:text="${album.genero}">Género</span>
                                    </td>
                                    <td class="px-4 text-secondary small" th:text="${#temporals.format(album.fechaEstreno, 'dd/MM/yyyy')}">01/01/2024</td>
                                    <td class="px-4 text-secondary small" th:text="${album.artista.email}">Artista</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div th:if="${#lists.isEmpty(albumes)}" class="text-center mt-4">
                    <span class="text-secondary">No hay álbumes registrados.</span>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
